# ============================================================
# FILE    : docker-compose.yml
# PURPOSE : Oracle XE 21c for local development
# USAGE   : docker-compose up -d
#           Wait ~2 minutes for Oracle to fully start.
# IMAGE   : gvenzl/oracle-xe (community Oracle XE image)
# ============================================================
version: "3.8"
services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: isp_oracle_xe
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: oracle            # SYS and SYSTEM password
      APP_USER: isp_app                  # auto-creates this user in XEPDB1
      APP_USER_PASSWORD: "ISP_Secure#2025"
    ports:
      - "1521:1521"
    volumes:
      - isp_oracle_data:/opt/oracle/oradata
      - ./database:/docker-entrypoint-initdb.d   # .sql files run at first start

volumes:
  isp_oracle_data:

# After startup, connect with:
#   sqlplus isp_app/"ISP_Secure#2025"@//localhost:1521/XEPDB1
# Or from Java:
#   jdbc:oracle:thin:@//localhost:1521/XEPDB1
